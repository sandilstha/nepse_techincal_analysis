# Run the whole stack locally with:  docker compose up --build
# App will be at http://localhost:8000
#
# This spins up MySQL + the Django app. The app container waits for MySQL,
# runs migrations and collectstatic, then serves via gunicorn (WhiteNoise
# serves the static assets).
#
# ── Auto-deploy via git pull (production/server use) ───────────────────────
# `web` bind-mounts this repo checkout into the container at /app. On every
# container start/restart, docker/entrypoint.sh does a fast-forward-only
# `git pull origin main` against that checkout before starting gunicorn — so
# redeploying is just:
#     git -C /path/to/repo fetch && docker compose restart web
# (or simply `docker compose restart web`, since the entrypoint itself pulls).
# Rebuild (`docker compose up -d --build`) only when Dockerfile/requirements
# change, not for ordinary app-code changes.
#
# One-time host setup:
#   1. Clone this repo on the server with a remote git can already push/pull
#      (SSH deploy key, or an HTTPS URL with an embedded token/credential
#      helper) — the container reuses whatever remote + credentials are
#      already configured in the checkout's .git/config.
#   2. Set DEPLOY_UID / DEPLOY_GID below (put them in a .env next to this
#      file) to the host user that owns the clone, e.g. `id -u` / `id -g` of
#      the deploy account — so the container can read/write the bind-mounted
#      working tree (git pull, collectstatic, etc.) without permission
#      errors. Defaults to 10001/10001, matching the image's built-in
#      non-root `appuser`, which is only correct if the clone happens to be
#      owned by uid/gid 10001 on the host.
#   3. Your existing Cloudflare tunnel should already point at this
#      container's published port (8000) — nothing to change there.

services:
  db:
    image: mysql:8.4
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_DATABASE: nepse_database
      MYSQL_ROOT_PASSWORD: nepse_root_pw
    ports:
      # Exposed so you can inspect the DB from the host (e.g. MySQL Workbench).
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pnepse_root_pw"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  web:
    build: .
    depends_on:
      db:
        condition: service_healthy
    # Bind-mount the repo so `git pull` inside the container updates real
    # files on the host, and vice versa. Comment this out for a pure
    # build-once/COPY-based deploy (no auto-pull).
    volumes:
      - .:/app
    # Match the host user that owns the checkout above (see the auto-deploy
    # notes) so the bind mount is writable. Set DEPLOY_UID/DEPLOY_GID in a
    # .env file next to this compose file to override the defaults.
    user: "${DEPLOY_UID:-10001}:${DEPLOY_GID:-10001}"
    # Everything app-specific (DB_*, DJANGO_*, GEMINI_API_KEY, OPENROUTER_API_KEY, ...)
    # comes from your own .env — copy .env.example to .env and fill it in first.
    # This is what lets DB_HOST point at an external MySQL server (or the bundled
    # `db` service below, for local dev) without editing this file.
    env_file:
      - .env
    environment:
      # ── Auto-deploy ────────────────────────────────────────────────────
      GIT_AUTO_PULL: "1"
      GIT_AUTO_PULL_BRANCH: "main"

      # Gunicorn worker count. Keep at 1 so the in-process LocMemCache (and the
      # dashboard's cold-build stampede lock) stay shared. To scale beyond 1,
      # also set REDIS_URL in .env so the cache/lock are shared across workers.
      WEB_CONCURRENCY: "1"
    ports:
      - "8000:8000"
    restart: unless-stopped

volumes:
  mysql_data:
